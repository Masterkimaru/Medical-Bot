# fly.toml app configuration file generated for medical-bot on 2026-11-10T06:21:54Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'medical-bot'
primary_region = 'ams'
kill_timeout = '60s'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-2x'
